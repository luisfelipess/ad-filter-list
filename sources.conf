## LIST OF SOURCES
## Format: primary_url [, fallback_url] [tier=<name>]
## Lines starting with #, ;, or ! are ignored. Inline # comments are supported.
## Two URLs separated by a comma: primary is tried first (with retries),
## fallback is used only if primary fails completely.
## Sources default to the tier marked * in tiers.conf (currently: good).
##
## Registry IDs refer to https://adguardteam.github.io/HostlistsRegistry/assets/filters.json
## Health annotations (redundant / low_value) are from the last pipeline run.

