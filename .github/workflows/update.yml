name: Update blocklists

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # daily at 03:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run pipeline
        run: python3 run.py

      - name: Commit pipeline output
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "luifelss"
          git config user.email "146073519+luisfelipess@users.noreply.github.com"

          # processed/ — all output formats
          # reports/   — blocklist-report.json, rejected-entries.txt
          # README.md  — stats block updated by post_run.py
          git add processed/ reports/ README.md

          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update blocklists [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload pipeline output
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: pipeline-output
          path: |
            processed/
            reports/
