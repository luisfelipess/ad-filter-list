name: Update blocklists

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # daily at 03:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run update.sh
        run: |
          chmod +x ./update.sh
          ./update.sh
          echo "Current dir:" && pwd
          echo "Processed dir contents:"
          ls -la processed/

      - name: Commit processed files
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add processed/ reports/

          if git diff --staged --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update processed/ files [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Pushed blocklist and related files."

      - name: Upload processed dir
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: processed-files
          path: |
            processed/
            reports/
