name: Update blocklists

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # daily at 03:00 UTC

permissions:
  contents: write

# Never let two runs push concurrently — the data commit is force-pushed.
concurrency:
  group: update-blocklists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run pipeline
        run: python3 run.py

      - name: Write step summary
        if: always()
        shell: bash
        run: |
          REPORT=reports/blocklist-report.json
          if [[ ! -f "$REPORT" ]]; then
            echo "No report found — pipeline may have failed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          DEDUPED=$(jq '.summary.unique_deduped'  "$REPORT")
          OPTIMIZED=$(jq '.summary.unique_optimized' "$REPORT")
          WILDCARDS=$(jq '.summary.wildcards'     "$REPORT")
          SCANNED=$(jq  '.summary.scanned'        "$REPORT")
          DELTA_A=$(jq  '.summary.delta_added'    "$REPORT")
          DELTA_R=$(jq  '.summary.delta_removed'  "$REPORT")
          REJECTED=$(jq '.summary.rejected_total' "$REPORT")
          SOURCES=$(jq  '.sources | length'       "$REPORT")
          {
            echo "## Blocklist pipeline summary"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Sources | $SOURCES |"
            echo "| Scanned | $SCANNED |"
            echo "| Unique domains (hosts/domains) | $DEDUPED |"
            echo "| Unique domains (DNS-optimized) | $OPTIMIZED |"
            echo "| Wildcards | $WILDCARDS |"
            echo "| Delta added | +$DELTA_A |"
            echo "| Delta removed | -$DELTA_R |"
            echo "| Rejected entries | $REJECTED |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit pipeline output
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "luifelss"
          git config user.email "146073519+luisfelipess@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          # processed/ — all output formats
          # reports/   — blocklist-report.json, rejected-entries.txt
          # README.md  — stats block updated by post_run.py
          git add processed/ reports/ README.md

          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REPORT=reports/blocklist-report.json
          if [[ -f "$REPORT" ]]; then
            DEDUPED=$(jq '.summary.unique_deduped'  "$REPORT")
            DELTA_A=$(jq '.summary.delta_added'    "$REPORT")
            DELTA_R=$(jq '.summary.delta_removed'  "$REPORT")
            MSG="Update blocklists: ${DEDUPED} domains (+${DELTA_A}/-${DELTA_R}) [skip ci]"
          else
            MSG="Update blocklists [skip ci]"
          fi

          # Squash-in-place: the generated outputs are large and regenerated daily,
          # so we keep only ONE rolling data commit at the tip instead of stacking a
          # new ~60 MB commit every day (which previously bloated the repo to ~5 GB).
          #
          # If the current tip is already the bot's rolling data commit, amend it;
          # otherwise (tip is a human/code commit) create a fresh data commit on top.
          # Either way we force-push — this only ever rewrites the single data commit,
          # never any code commit beneath it.
          BOT_EMAIL="146073519+luisfelipess@users.noreply.github.com"
          TIP_MSG=$(git log -1 --format='%s')
          TIP_EMAIL=$(git log -1 --format='%ae')
          if [[ "$TIP_MSG" == "Update blocklists"* && "$TIP_EMAIL" == "$BOT_EMAIL" ]]; then
            git commit --amend -m "$MSG"
          else
            git commit -m "$MSG"
          fi
          git push --force origin HEAD:${{ github.ref_name }}
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload pipeline output
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: pipeline-output
          path: |
            processed/
            reports/
