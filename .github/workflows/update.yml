name: Update blocklists

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # daily at 03:00 UTC

permissions:
  contents: write

# Never let two runs push concurrently — the data commit is force-pushed.
concurrency:
  group: update-blocklists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Parent required for generated-path detection before amending the tip.
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run regression tests
        run: python3 -m unittest discover -s tests

      - name: Restore validated source cache
        uses: actions/cache@v4
        with:
          path: |
            raw/.source-cache
            raw/.fetch-cache.json
          key: source-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            source-cache-${{ runner.os }}-

      - name: Run pipeline
        id: pipeline
        run: python3 run.py

      - name: Write step summary
        if: always()
        shell: bash
        run: |
          if [[ -f raw/fetch-status.json ]]; then
            jq -r '"Download health: stale=\(.stale_sources), failed=\(.failed_sources), blocked=\(.blocked)"' raw/fetch-status.json >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${{ steps.pipeline.outcome }}" != "success" ]]; then
            echo "Pipeline failed; no new blocklists were published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          REPORT=reports/blocklist-report.json
          if [[ ! -f "$REPORT" ]]; then
            echo "No report found — pipeline may have failed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          DEDUPED=$(jq '.summary.unique_deduped'  "$REPORT")
          OPTIMIZED=$(jq '.summary.unique_optimized' "$REPORT")
          WILDCARDS=$(jq '.summary.wildcards'     "$REPORT")
          SCANNED=$(jq  '.summary.scanned'        "$REPORT")
          DELTA_A=$(jq  '.summary.delta_added'    "$REPORT")
          DELTA_R=$(jq  '.summary.delta_removed'  "$REPORT")
          REJECTED=$(jq '.summary.rejected_total' "$REPORT")
          STALE=$(jq '.fetch.stale_sources // 0' "$REPORT")
          SOURCES=$(jq  '.sources | length'       "$REPORT")
          {
            echo "## Blocklist pipeline summary"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Sources | $SOURCES |"
            echo "| Stale sources reused | $STALE |"
            echo "| Scanned | $SCANNED |"
            echo "| Unique domains (hosts/domains) | $DEDUPED |"
            echo "| Unique domains (DNS-optimized) | $OPTIMIZED |"
            echo "| Wildcards | $WILDCARDS |"
            echo "| Delta added | +$DELTA_A |"
            echo "| Delta removed | -$DELTA_R |"
            echo "| Rejected entries | $REJECTED |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit pipeline output
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.ref_name }}
          EXPECTED_REMOTE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name "luisfelipess"
          git config user.email "146073519+luisfelipess@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          # processed/ — all output formats
          # reports/   — blocklist-report.json, rejected-entries.txt
          # README.md  — stats block updated by post_run.py
          git add processed/ reports/ README.md

          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          REPORT=reports/blocklist-report.json
          if [[ -f "$REPORT" ]]; then
            DEDUPED=$(jq '.summary.unique_deduped'  "$REPORT")
            DELTA_A=$(jq '.summary.delta_added'    "$REPORT")
            DELTA_R=$(jq '.summary.delta_removed'  "$REPORT")
            MSG="Update blocklists: ${DEDUPED} domains (+${DELTA_A}/-${DELTA_R}) [skip ci]"
          else
            MSG="Update blocklists [skip ci]"
          fi

          # Squash-in-place: the generated outputs are large and regenerated daily,
          # so we keep only ONE rolling data commit at the tip instead of stacking a
          # new ~60 MB commit every day (which previously bloated the repo to ~5 GB).
          #
          # The tip is a rolling data commit when its subject has the
          # Update-blocklists prefix AND it changed only generated paths. This is
          # detected by content (not author), so no identity is referenced here.
          # If so we amend it; otherwise (tip is a code commit) we start a fresh
          # data commit on top. Either way the force-push only ever rewrites that
          # single data commit, never a code commit beneath it.
          TIP_SUBJECT=$(git log -1 --format='%s')
          TIP_OTHER=$(git show --name-only --format='' HEAD \
                      | grep -vE '^(processed/|reports/|README\.md$)' | grep -v '^$' || true)
          if [[ "$TIP_SUBJECT" == "Update blocklists"* && -z "$TIP_OTHER" ]]; then
            git commit --amend -m "$MSG"
          else
            git commit -m "$MSG"
          fi
          bash scripts/push-with-lease.sh origin "$TARGET_BRANCH" "$EXPECTED_REMOTE_SHA"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload pipeline output
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: pipeline-output
          path: |
            processed/
            reports/
